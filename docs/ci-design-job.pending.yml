# OPTIONAL extra job — the existing CI `test` job already checks out with
# fetch-depth: 0 (14 November 2026) so `npm test` / check-design can resolve
# merge-base on push. This file is only the sketched dedicated `design` job.
#
# A push of `.github/workflows/ci.yml` on 13 November 2026 was rejected:
#   "refusing to allow an OAuth App to create or update workflow
#    `.github/workflows/ci.yml` without `workflow` scope"
#
# To add this as a separate job: copy the `design` job below into
# .github/workflows/ci.yml and push with a token that has the `workflow`
# scope. Do not replace the existing `test` job.
#
# name: ci
# on: { push, pull_request }
# jobs:
design:
  runs-on: ubuntu-latest
  steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Fetch PR base
      if: github.event_name == 'pull_request'
      run: git fetch --no-tags origin ${{ github.base_ref }}
    - run: node scripts/check-design.mjs
